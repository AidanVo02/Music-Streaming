<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Onyx — Discovery</title>
  <link rel="stylesheet" href="/src/css/base.css">
  <link rel="stylesheet" href="/src/css/components.css">
  <link rel="stylesheet" href="/src/css/layout.css">
  <link rel="stylesheet" href="/src/css/pages/discovery.css">
</head>
<body>
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal" id="modal-content"></div>
  </div>

  <div class="page-body">
    <div class="page-wrap">
      <div class="page-header">
        <h1>DISCOVERY</h1>
        <p>Top signals by genre — sorted by play count</p>
      </div>

      <!-- Genre Filter -->
      <div id="genre-filter" class="genre-filter">
        <button class="genre-chip active" data-genre="">ALL</button>
      </div>

      <!-- Tracks -->
      <div id="tracks-container" class="tracks-list">
        <div class="loading-state"><div class="spinner"></div><p>Loading signals...</p></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/js/pages/discovery.js"></script>
</body>
</html>
